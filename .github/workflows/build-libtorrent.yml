name: Build libtorrent

# 独立构建 libtorrent-rasterbar（9 个平台）
# 编译后上传到 GitHub Release
#
# 触发：仅手动触发（支持平台筛选）
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '选择平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
          - android
          - ios

jobs:
  # 读取版本配置
  config:
    name: config
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Read version from versions.py
        id: version
        run: |
          VERSION=$(python3 -c "from scripts.versions import LIBTORRENT_VERSION; print(LIBTORRENT_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=libtorrent-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "libtorrent version: $VERSION"
          echo "release tag: libtorrent-v$VERSION"

  build:
    name: libtorrent-${{ matrix.name }}
    needs: config
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            platform: macos
            arch: universal

          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64

          - name: linux-arm64
            os: ubuntu-latest
            platform: linux
            arch: arm64

          - name: windows-x64
            os: windows-2022
            platform: windows
            arch: x64

          - name: windows-arm64
            os: windows-2022
            platform: windows
            arch: arm64

          - name: ios-arm64
            os: macos-latest
            platform: ios
            arch: arm64

          - name: ios-simulator-universal
            os: macos-latest
            platform: ios
            arch: universal

          - name: android-arm64
            os: ubuntu-latest
            platform: android
            arch: arm64

          - name: android-x64
            os: ubuntu-latest
            platform: android
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          PLATFORM="${{ matrix.name }}"
          SELECTED="${{ inputs.platforms || 'all' }}"
          if [ "$SELECTED" = "all" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "macos" ] && [[ "$PLATFORM" == macos* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "linux" ] && [[ "$PLATFORM" == linux* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "windows" ] && [[ "$PLATFORM" == windows* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "android" ] && [[ "$PLATFORM" == android* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "ios" ] && [[ "$PLATFORM" == ios* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize paths
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          DW_TEMP=$(echo "$RUNNER_TEMP" | tr '\\' '/')
          echo "DW_TEMP=$DW_TEMP" >> "$GITHUB_ENV"

      - name: Setup Android NDK
        if: steps.filter.outputs.run == 'true' && matrix.platform == 'android'
        shell: bash
        run: |
          NDK=$(echo "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" | tr '\\' '/')
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      - name: Install Linux build deps
        if: steps.filter.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config
          if [ "${{ matrix.arch }}" = "arm64" ] && [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      # vcpkg 二进制缓存
      - name: Cache vcpkg binary archives
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-libtorrent-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-libtorrent-${{ matrix.name }}-

      - name: Setup vcpkg
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          VCPKG_DIR="${{ runner.temp }}/vcpkg"
          if [ ! -d "$VCPKG_DIR" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          fi
          # bootstrap
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$VCPKG_DIR/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Build
        if: steps.filter.outputs.run == 'true'
        shell: bash
        env:
          LT_VERSION: ${{ needs.config.outputs.version }}
        run: |
          echo "== 构建前磁盘 =="
          df -h / || true

          OUTPUT_DIR="${{ runner.temp }}/libtorrent-${{ matrix.name }}"

          python3 "${{ github.workspace }}/scripts/build_libtorrent.py" \
            --version "$LT_VERSION" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --tag "${{ matrix.name }}" \
            --output-dir "$OUTPUT_DIR" \
            --pack

          echo "== 构建后磁盘 =="
          df -h / || true

      - name: Upload artifact
        if: steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: libtorrent-${{ matrix.name }}
          path: ${{ runner.temp }}/libtorrent-v${{ needs.config.outputs.version }}-*.tar.gz
          retention-days: 90

  # 所有平台构建完成后，上传到 Release
  release:
    name: Upload to Release
    needs: [config, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.config.outputs.release_tag }}"
          echo "Release tag: $TAG"
          
          # 创建或更新 Release
          gh release view "$TAG" 2>/dev/null || \
            gh release create "$TAG" \
              --title "libtorrent v${{ needs.config.outputs.version }}" \
              --notes "libtorrent-rasterbar v${{ needs.config.outputs.version }} 预编译产物" \
              --target main
          
          # 上传所有 tar.gz 文件（覆盖同名）
          for file in artifacts/libtorrent-v*.tar.gz; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload "$TAG" "$file" --clobber
            fi
          done

          # 清理孤儿资产：仅全平台运行才做差集清理，避免过滤运行误删未构建平台的历史资产
          SELECTED="${{ inputs.platforms || 'all' }}"
          if [ "$SELECTED" = "all" ]; then
            for name in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              case "$name" in
                libtorrent-v${{ needs.config.outputs.version }}-*)
                  if [ ! -f "artifacts/$name" ]; then
                    echo "删除孤儿资产: $name"
                    gh release delete-asset "$TAG" "$name" --yes
                  fi
                  ;;
              esac
            done
          fi

          echo "✅ Release 上传完成"
