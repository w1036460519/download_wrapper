name: Build libwebrtc (裁剪版)

# 从源码编译 webrtc-sdk/libwebrtc（DataChannel 裁剪版），
# 产物上传为 GitHub Release 供 download_wrapper CI 消费。
#
# 构建逻辑由 scripts/build_libwebrtc.py 统一处理，
# workflow 仅负责环境准备、缓存、产物上传。
#
# 触发：手动触发 或 标签 push（libwebrtc-v*）
on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: 'webrtc-sdk/webrtc 分支'
        required: true
        default: 'm144_release'
  push:
    tags:
      - 'libwebrtc-v*'

env:
  LIBWEBRTC_TAG: 'libwebrtc.m144.7559.09'

jobs:
  build:
    name: libwebrtc-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos,           os: macos-latest,  target_os: mac,     asset: libwebrtc-macos-release.zip }
          - { name: linux-x64,       os: ubuntu-24.04,  target_os: linux,   asset: libwebrtc-linux-x64-release.zip }
          - { name: linux-arm64,     os: ubuntu-24.04,  target_os: linux,   asset: libwebrtc-linux-arm64-release.zip }
          - { name: windows-x64,     os: windows-2022,  target_os: win,     asset: libwebrtc-windows-x64-release.zip }
          - { name: windows-arm64,   os: windows-2022,  target_os: win,     asset: libwebrtc-windows-arm64-release.zip }
          - { name: android-arm64,   os: ubuntu-24.04,  target_os: android, asset: libwebrtc-android-arm64-release.zip }
          - { name: android-x64,     os: ubuntu-24.04,  target_os: android, asset: libwebrtc-android-x64-release.zip }
          - { name: ios-arm64,       os: macos-latest,  target_os: ios,     asset: libwebrtc-ios-arm64-release.zip }
          - { name: ios-simulator,   os: macos-latest,  target_os: ios,     asset: libwebrtc-ios-simulator-release.zip }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── 路径规范化 ──
      # RUNNER_TEMP 在 Windows 含反斜杠，Python 的 pathlib 可处理，
      # 但 gclient 等外部工具需要正斜杠，统一转换。
      - name: Normalize paths
        shell: bash
        run: |
          DW_TEMP=$(echo "$RUNNER_TEMP" | tr '\\' '/')
          echo "DW_TEMP=$DW_TEMP" >> "$GITHUB_ENV"

      # ── Android NDK ──
      - name: Setup Android NDK
        if: matrix.target_os == 'android'
        shell: bash
        run: |
          NDK=$(echo "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" | tr '\\' '/')
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      # ── 缓存构建产物（ninja 增量编译） ──
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/webrtc_src/src/out/Release
            ${{ runner.temp }}/webrtc_src/src/out/Release-x64
          key: libwebrtc-build-${{ matrix.name }}-${{ env.LIBWEBRTC_TAG }}

      # ── 构建（Python 脚本统一处理） ──
      - name: Build
        shell: bash
        run: |
          echo "== 构建前磁盘 =="
          df -h / || true

          python3 "${{ github.workspace }}/scripts/build_libwebrtc.py" \
            --platform "${{ matrix.name }}" \
            --webrtc-branch "${{ inputs.webrtc_branch || 'm144_release' }}" \
            --temp-dir "$DW_TEMP"

          echo "== 构建后磁盘 =="
          df -h / || true

      # ── 上传产物 ──
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: libwebrtc-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/libwebrtc-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/${{ matrix.asset }}
          generate_release_notes: true
