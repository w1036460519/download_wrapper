name: Build Wrapper

# 独立构建 download_wrapper（9 个平台）
# 从 Release 下载 libwebrtc/libtorrent 预编译产物
#
# 触发：仅手动触发
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '选择平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
          - android
          - ios

env:
  VCPKG_REF: 'latest'

jobs:
  # 读取版本配置
  config:
    name: config
    runs-on: ubuntu-latest
    outputs:
      libtorrent_version: ${{ steps.version.outputs.libtorrent_version }}
      libwebrtc_version: ${{ steps.version.outputs.libwebrtc_version }}
      wrapper_version: ${{ steps.version.outputs.wrapper_version }}
      wrapper_release_tag: ${{ steps.version.outputs.wrapper_release_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Read versions from versions.py
        id: version
        run: |
          LT_VERSION=$(python3 -c "from scripts.versions import LIBTORRENT_VERSION; print(LIBTORRENT_VERSION)")
          LW_VERSION=$(python3 -c "from scripts.versions import LIBWEBRTC_VERSION; print(LIBWEBRTC_VERSION)")
          W_VERSION=$(python3 -c "from scripts.versions import WRAPPER_VERSION; print(WRAPPER_VERSION)")
          W_TAG=$(python3 -c "from scripts.versions import get_wrapper_release_tag; print(get_wrapper_release_tag())")
          echo "libtorrent_version=$LT_VERSION" >> "$GITHUB_OUTPUT"
          echo "libwebrtc_version=$LW_VERSION" >> "$GITHUB_OUTPUT"
          echo "wrapper_version=$W_VERSION" >> "$GITHUB_OUTPUT"
          echo "wrapper_release_tag=$W_TAG" >> "$GITHUB_OUTPUT"
          echo "libtorrent: $LT_VERSION"
          echo "libwebrtc: $LW_VERSION"
          echo "wrapper: $W_VERSION (tag: $W_TAG)"

  build:
    name: wrapper-${{ matrix.name }}
    needs: config
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            bincache: ~/.cache/vcpkg/archives
          - name: linux-x64
            os: ubuntu-latest
            bincache: ~/.cache/vcpkg/archives
          - name: linux-arm64
            os: ubuntu-latest
            bincache: ~/.cache/vcpkg/archives
          - name: windows-x64
            os: windows-2022
            bincache: ~\AppData\Local\vcpkg\archives
          - name: windows-arm64
            os: windows-2022
            bincache: ~\AppData\Local\vcpkg\archives
          - name: ios-arm64
            os: macos-latest
            bincache: ~/.cache/vcpkg/archives
          - name: ios-simulator-universal
            os: macos-latest
            bincache: ~/.cache/vcpkg/archives
          - name: android-arm64
            os: ubuntu-latest
            bincache: ~/.cache/vcpkg/archives
          - name: android-x64
            os: ubuntu-latest
            bincache: ~/.cache/vcpkg/archives

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          PLATFORM="${{ matrix.name }}"
          SELECTED="${{ inputs.platforms || 'all' }}"
          if [ "$SELECTED" = "all" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "macos" ] && [[ "$PLATFORM" == macos* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "linux" ] && [[ "$PLATFORM" == linux* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "windows" ] && [[ "$PLATFORM" == windows* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "android" ] && [[ "$PLATFORM" == android* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "ios" ] && [[ "$PLATFORM" == ios* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize paths
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          DW_TEMP=$(echo "$RUNNER_TEMP" | tr '\\' '/')
          echo "DW_TEMP=$DW_TEMP" >> "$GITHUB_ENV"

      # 缓存 Release 下载的 libtorrent 预编译产物（third_party 下，命中则跳过重复下载）
      - name: Cache libtorrent (downloaded from Release)
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third_party/libtorrent-*
          key: libtorrent-cache-${{ matrix.name }}-v${{ needs.config.outputs.libtorrent_version }}
          restore-keys: |
            libtorrent-cache-${{ matrix.name }}-

      # 从缓存读取 libwebrtc 构建产物（与 build-libwebrtc.yml 共享）
      - name: Cache libwebrtc (from build-libwebrtc workflow)
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/webrtc_src
            ${{ runner.temp }}/webrtc_build
          key: libwebrtc-cache-${{ matrix.name }}-${{ needs.config.outputs.libwebrtc_version }}
          restore-keys: |
            libwebrtc-cache-${{ matrix.name }}-

      # 缓存 vcpkg 二进制归档
      - name: Cache vcpkg binary archives
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ matrix.bincache }}
          key: vcpkg-${{ matrix.name }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-${{ env.VCPKG_REF }}-
            vcpkg-${{ matrix.name }}-

      # 缓存 CMake 构建产物（增量编译）
      - name: Cache CMake build
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/build
            ${{ github.workspace }}/build-arm64
            ${{ github.workspace }}/build-x64
            ${{ github.workspace }}/build-sim-arm64
            ${{ github.workspace }}/build-sim-x64
          key: cmake-build-${{ matrix.name }}-${{ hashFiles('src/**', 'include/**', 'CMakeLists.txt', 'vcpkg.json') }}
          restore-keys: |
            cmake-build-${{ matrix.name }}-

      # Linux 系统依赖
      - name: Install Linux build deps
        if: steps.filter.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config
          # linux-arm64 交叉编译器（x64 runner 上编译 arm64 目标）
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # 构建
      - name: Build
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          echo "== 构建前磁盘 =="
          df -h / || true

          python3 "${{ github.workspace }}/scripts/build_wrapper.py" \
            --platform "${{ matrix.name }}" \
            --vcpkg-ref "${{ env.VCPKG_REF }}" \
            --workspace "${{ github.workspace }}" \
            --temp-dir "${{ runner.temp }}" \
            --libwebrtc-dir "${{ runner.temp }}/webrtc_build" \
            --libtorrent-dir "${{ runner.temp }}/libtorrent-${{ matrix.name }}"

          echo "== 构建后磁盘 =="
          df -h / || true

      # 打包 Release 产物（二进制 + 公共头文件）
      - name: Pack release asset
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          ASSET=$(python3 -c "from scripts.versions import get_wrapper_asset_name; print(get_wrapper_asset_name('${{ matrix.name }}'))")
          echo "Packing: $ASSET"
          python3 - "$ASSET" <<'PYEOF'
          import sys, tarfile
          from pathlib import Path
          asset = sys.argv[1]
          with tarfile.open(asset, "w:gz") as tar:
              for f in Path("dist").iterdir():
                  tar.add(f, arcname=f.name)
              tar.add("include", arcname="include")
          print(f"Packed: {asset}")
          PYEOF

      - name: Upload artifact
        if: steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: wrapper-${{ matrix.name }}
          path: wrapper-v*.tar.gz
          if-no-files-found: error

  # 所有平台构建完成后，上传到 Release
  release:
    name: Upload to Release
    needs: [config, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.config.outputs.wrapper_release_tag }}"
          echo "Release tag: $TAG"

          # 创建或更新 Release
          gh release view "$TAG" 2>/dev/null || \
            gh release create "$TAG" \
              --title "wrapper v${{ needs.config.outputs.wrapper_version }}" \
              --notes "download_wrapper v${{ needs.config.outputs.wrapper_version }} 预编译产物" \
              --target main

          # 上传所有 tar.gz 文件（覆盖同名）
          for file in artifacts/wrapper-v*.tar.gz; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload "$TAG" "$file" --clobber
            fi
          done

          # 清理孤儿资产：仅全平台运行才做差集清理，避免过滤运行误删未构建平台的历史资产
          SELECTED="${{ inputs.platforms || 'all' }}"
          if [ "$SELECTED" = "all" ]; then
            for name in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              case "$name" in
                wrapper-v${{ needs.config.outputs.wrapper_version }}-*)
                  if [ ! -f "artifacts/$name" ]; then
                    echo "删除孤儿资产: $name"
                    gh release delete-asset "$TAG" "$name" --yes
                  fi
                  ;;
              esac
            done
          fi

          echo "✅ Release 上传完成"
