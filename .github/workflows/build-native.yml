name: Build download_wrapper

# 触发条件：仅手动触发（Actions 页面 → Run workflow）
on:
  workflow_dispatch:

env:
  # 固定 vcpkg 版本（发布 tag，可复现）；升级依赖时改这里即可
  VCPKG_REF: '2026.06.24'
  # libwebrtc 自构建产物版本（build-libwebrtc.yml 发布的 release tag）
  LIBWEBRTC_RELEASE_TAG: 'libwebrtc-v1'

jobs:
  build:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            bincache: ~/.cache/vcpkg/archives
          - name: linux-x64
            os: ubuntu-24.04
            bincache: ~/.cache/vcpkg/archives
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bincache: ~/.cache/vcpkg/archives
          - name: windows-x64
            os: windows-2022
            bincache: ~\AppData\Local\vcpkg\archives
          - name: windows-arm64
            os: windows-2022
            bincache: ~\AppData\Local\vcpkg\archives
          - name: ios-arm64
            os: macos-latest
            bincache: ~/.cache/vcpkg/archives
          - name: ios-simulator-universal
            os: macos-latest
            bincache: ~/.cache/vcpkg/archives
          - name: android-arm64
            os: ubuntu-24.04
            bincache: ~/.cache/vcpkg/archives
          - name: android-x64
            os: ubuntu-24.04
            bincache: ~/.cache/vcpkg/archives

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 缓存 vcpkg 二进制归档（命中后依赖无需重复编译）
      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: ${{ matrix.bincache }}
          key: vcpkg-${{ matrix.name }}-${{ env.VCPKG_REF }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.name }}-${{ env.VCPKG_REF }}-
            vcpkg-${{ matrix.name }}-

      # Linux 构建缺失的系统级依赖（libtorrent/boost 传递依赖需要）
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      # 构建（Python 脚本统一处理）
      - name: Build
        shell: bash
        run: |
          echo "== 构建前磁盘 =="
          df -h / || true

          python3 "${{ github.workspace }}/scripts/build_wrapper.py" \
            --platform "${{ matrix.name }}" \
            --vcpkg-ref "${{ env.VCPKG_REF }}" \
            --workspace "${{ github.workspace }}" \
            --temp-dir "${{ runner.temp }}"

          echo "== 构建后磁盘 =="
          df -h / || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: download_wrapper-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # ========== 发布：推送 v* 标签时，汇总全平台产物并创建 GitHub Release ==========
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
          echo "== 待发布资产 =="
          ls -l release

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
